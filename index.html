<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Danielle Modesti">
    <meta name="keywords" content="Form, contact, HTML">
    <meta name="description" content="A contact form to get support.">
    <title>Contact Form</title>
</head>
<body>
    <header>
        <h1>Acme Support</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#hel-page">Help</a></li>
                <li><a href="#contact-page">Contact</a></li>
            </ul>
        </nav>
    </header>
    <hr>
    <main>
        <h2>Contact Us</h2>
        <p>Send us a message and we will get back to you.</p>
        <form action="https://httpbin.org/post" method="post">
            <p>
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="subject">Subject</label>
                <select name="subject" id="subject">
                    <option value="equip">Equipment Malfunctioning</option>
                    <option value="conn">Connection problem</option>
                    <option value="upgr">Upgrade my plan</option>
                </select>
            </p>
            <p>
                <label for="message">Message</label>
                <br>
                <textarea required id="message" name="message" rows="10" cols="30" minlength="50"></textarea>
            </p>
            <fieldset>
                <legend>How did you hear about us?</legend>
                <input type="radio" id="media1" name="media" value="media1">
                <label for="media1">Search</label>
                <br>
                <input type="radio" id="media2" name="media" value="media2">
                <label for="media2">Friend</label>
                <br>
                <input type="radio" id="media3" name="media" value="media3">
                <label for="media3">Social media</label>
            </fieldset>
            <p>
                <input type="checkbox" id="updates" name="updates" value="yes">
                <label for="updates">Send me product updates</label>
            </p>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <hr>
    <footer>
        <p>&copy; <time datetime="2026">2026</time> Acme Support</p>
    </footer>
</body>
</html>
